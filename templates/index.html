<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中金所杯信号看板</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">CFFEX CUP / SIGNAL ONLY</p>
        <h1>期货信号看板</h1>
        <p class="muted">只提醒，不自动下单。请在东方财富期货 APP 中人工确认。</p>
      </div>
      <div class="actions">
        <button id="notify" class="secondary" type="button">启用电脑通知</button>
        <button id="refresh" type="button">刷新信号</button>
      </div>
    </header>
    <section class="summary" aria-live="polite">
      <div><span>模式</span><strong id="mode">-</strong></div>
      <div><span>期货账户</span><strong id="equity">-</strong></div>
      <div><span>保证金上限</span><strong id="cap">-</strong></div>
      <div><span>更新时间</span><strong id="updated">-</strong></div>
    </section>
    <section>
      <div class="section-title"><h2>股指期货</h2><span>14:45 后不再开新仓，14:55 前平仓</span></div>
      <div id="contracts" class="grid"></div>
    </section>
    <p id="notice" class="notice"></p>
  </main>
  <script>
    const money = n => n == null ? '-' : Number(n).toLocaleString('zh-CN');
    const actionable = row => row.direction === '做多' || row.direction === '做空';
    let firstRender = true;
    let previousSignals = new Map();

    function signalKey(row) {
      return [row.direction, row.entry, row.stop, row.suggested_lots, row.status].join('|');
    }

    function notifySignal(row) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const notification = new Notification(`中金所杯信号：${row.code} ${row.direction}`, {
        body: `入场参考 ${money(row.entry)}，止损参考 ${money(row.stop)}，建议 ${row.suggested_lots} 手`,
        tag: `cffex-${row.code}`,
      });
      notification.onclick = () => window.focus();
    }

    function render(data) {
      document.querySelector('#mode').textContent = data.mode;
      document.querySelector('#equity').textContent = money(data.account.futures_equity);
      document.querySelector('#cap').textContent = `${data.account.margin_cap * 100}%`;
      document.querySelector('#updated').textContent = data.updated_at;
      document.querySelector('#notice').textContent = data.notice;
      document.querySelector('#contracts').innerHTML = data.contracts.map(row => `
        <article class="contract">
          <div class="contract-head"><div><b>${row.code}</b><span>${row.name}</span></div><em>${row.status}</em></div>
          <div class="direction">${row.direction}</div>
          <dl><div><dt>最新价</dt><dd>${money(row.last_price)}</dd></div><div><dt>入场参考</dt><dd>${money(row.entry)}</dd></div><div><dt>止损参考</dt><dd>${money(row.stop)}</dd></div></dl>
          <p class="quote-meta">涨跌幅 ${row.change_pct == null ? '-' : row.change_pct + '%'} · 建议手数 ${row.suggested_lots} · 5分钟采样</p>
        </article>`).join('');
      const nextSignals = new Map();
      data.contracts.forEach(row => {
        if (!actionable(row)) return;
        const key = signalKey(row);
        nextSignals.set(row.code, key);
        if (!firstRender && previousSignals.get(row.code) !== key) notifySignal(row);
      });
      previousSignals = nextSignals;
      firstRender = false;
    }

    async function refresh() { render(await (await fetch('/api/snapshot')).json()); }

    document.querySelector('#notify').addEventListener('click', async () => {
      const button = document.querySelector('#notify');
      if (!('Notification' in window)) { button.textContent = '浏览器不支持通知'; return; }
      const permission = await Notification.requestPermission();
      button.textContent = permission === 'granted' ? '电脑通知已启用' : '通知权限未开启';
    });
    document.querySelector('#refresh').addEventListener('click', refresh);
    refresh();
    setInterval(refresh, 25000);
  </script>
</body>
</html>
